services:
  indexer-migrate:
    profiles: ['runtime']
    build:
      context: .
      dockerfile: indexer/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: '${INDEXER_DB_NAME}'
      DB_USER: '${INDEXER_DB_MIGRATION_USER}'
      DB_PASSWORD: '${INDEXER_DB_MIGRATION_PASSWORD}'
      DB_PASS: '${INDEXER_DB_MIGRATION_PASSWORD}'
      DB_SSL_MODE: disable
      MIGRATION_LOCK_TIMEOUT_MS: '30000'
      MIGRATION_STATEMENT_TIMEOUT_MS: '300000'
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    command: ['node', 'migrate.js']

  indexer-pipeline:
    profiles: ['runtime']
    restart: unless-stopped
    build:
      context: .
      dockerfile: indexer/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: '${INDEXER_DB_NAME}'
      DB_USER: '${INDEXER_DB_RUNTIME_USER}'
      DB_PASSWORD: '${INDEXER_DB_RUNTIME_PASSWORD}'
      DB_PASS: '${INDEXER_DB_RUNTIME_PASSWORD}'
      GATEWAY_URL: '${INDEXER_GATEWAY_URL}'
      RPC_ENDPOINT: '${INDEXER_RPC_ENDPOINT}'
      RPC_FALLBACK_ENDPOINTS: '${INDEXER_RPC_FALLBACK_ENDPOINTS:-}'
      START_BLOCK: '${INDEXER_START_BLOCK}'
      RATE_LIMIT: '${INDEXER_RATE_LIMIT}'
      RPC_CAPACITY: '${INDEXER_RPC_CAPACITY:-}'
      RPC_MAX_BATCH_CALL_SIZE: '${INDEXER_RPC_MAX_BATCH_CALL_SIZE:-}'
      RPC_REQUEST_TIMEOUT_MS: '${INDEXER_RPC_REQUEST_TIMEOUT_MS:-}'
      RPC_RETRY_ATTEMPTS: '${INDEXER_RPC_RETRY_ATTEMPTS:-}'
      RPC_HEAD_POLL_INTERVAL_MS: '${INDEXER_RPC_HEAD_POLL_INTERVAL_MS:-}'
      RPC_INGEST_DISABLED: '${INDEXER_RPC_INGEST_DISABLED:-false}'
      SUBSQUID_EVM_RPC_SPLIT_SIZE: '${INDEXER_RPC_BLOCK_SPLIT_SIZE:-10}'
      FINALITY_CONFIRMATION_BLOCKS: '${FINALITY_CONFIRMATION_BLOCKS}'
      CONTRACT_ADDRESS: '${INDEXER_CONTRACT_ADDRESS}'
      CHAIN_ID: '${INDEXER_CHAIN_ID}'
      COTSEL_ENVIRONMENT: '${COTSEL_ENVIRONMENT}'
      DB_SSL_MODE: '${INDEXER_DB_SSL_MODE:-disable}'
      EXPECTED_CONTRACT_CODEHASH: '${INDEXER_EXPECTED_CONTRACT_CODEHASH:-}'
      EXPECTED_ABI_FINGERPRINT: '${INDEXER_EXPECTED_ABI_FINGERPRINT:-}'
      VERIFY_START_BLOCK_CODE: '${INDEXER_VERIFY_START_BLOCK_CODE:-true}'
      NOTIFICATIONS_ENABLED: '${INDEXER_NOTIFICATIONS_ENABLED:-false}'
      NOTIFICATIONS_WEBHOOK_URL: '${INDEXER_NOTIFICATIONS_WEBHOOK_URL:-}'
      NOTIFICATIONS_COOLDOWN_MS: '${INDEXER_NOTIFICATIONS_COOLDOWN_MS:-300000}'
      NOTIFICATIONS_REQUEST_TIMEOUT_MS: '${INDEXER_NOTIFICATIONS_REQUEST_TIMEOUT_MS:-5000}'
      GRAPHQL_PORT: '${INDEXER_GRAPHQL_PORT}'
      READINESS_PORT: '${INDEXER_READINESS_PORT:-8090}'
      READINESS_MAX_CHECKPOINT_LAG_BLOCKS: '${INDEXER_READINESS_MAX_CHECKPOINT_LAG_BLOCKS:-150}'
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      indexer-migrate:
        condition: service_completed_successfully
    healthcheck:
      # Liveness only. Readiness (GET /ready) is reported, not used to restart.
      test:
        - CMD
        - node
        - -e
        - |
          fetch('http://127.0.0.1:' + process.env.READINESS_PORT + '/health')
            .then((response) => process.exit(response.ok ? 0 : 1))
            .catch(() => process.exit(1));
      interval: 15s
      timeout: 5s
      retries: 5

  indexer-graphql:
    profiles: ['runtime']
    build:
      context: .
      dockerfile: indexer/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: '${INDEXER_DB_NAME}'
      DB_USER: '${INDEXER_DB_READER_USER}'
      DB_PASSWORD: '${INDEXER_DB_READER_PASSWORD}'
      DB_PASS: '${INDEXER_DB_READER_PASSWORD}'
      GQL_PORT: '${INDEXER_GRAPHQL_PORT}'
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      indexer-migrate:
        condition: service_completed_successfully
    command: ['node', 'node_modules/@subsquid/graphql-server/bin/run.js', '--no-squid-status']
    ports:
      - '${INDEXER_GRAPHQL_PORT:-4350}:${INDEXER_GRAPHQL_PORT:-4350}'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const p = process.env.GQL_PORT || '4350';
          fetch('http://127.0.0.1:' + p + '/graphql', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: '{ __typename }' }),
          })
            .then((response) => process.exit(response.ok ? 0 : 1))
            .catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 8
