packages:
  - auth
  - contracts
  - gateway
  - indexer
  - oracle
  - sdk
  - shared-http
  - shared-edge
  - shared-db
  - shared-auth
  - reconciliation
  - notifications
  - ricardian
  - treasury

linkWorkspacePackages: true
preferWorkspacePackages: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Security fix for GHSA-mh99-v99m-4gvg. Keep the exception version-specific.
  - brace-expansion@5.0.9
  # Security fix for GHSA-7p8r-x3mc-p8w7. Keep the exception version-specific.
  - fast-uri@3.1.6
  # Security fixes for GHSA-c83g-rgw3-j3cx and GHSA-73wf-gq98-2v4g.
  - browserslist@4.28.7
  # Security fix for GHSA-p498-v437-472g.
  - '@humanfs/node@0.16.8'
  # Security fixes for GHSA-x5fp-wj9c-mxmx and GHSA-4mjr-xmp4-gh2g.
  - qs@6.16.0
  # Security fix for GHSA-8xcm-r25x-g524, GHSA-m8rv-5g2x-5cg5 and GHSA-v3r7-h72x-cjcm.
  # Keep the exception version-specific.
  - undici@6.28.0
  # Security fix for GHSA-2m8v-j782-fhvr. Keep the exception version-specific.
  - socket.io-parser@4.2.7
  # Security fix for GHSA-5p4m-2wfm-xmqj, high-severity quadratic CPU consumption in
  # !!omap resolution. 3.15.1 and 4.3.1 were published 31 July 2026 and are still inside
  # the 10080-minute window. Listed by bare name because pnpm 10 matches this setting on
  # package name only: a name@version entry is silently ignored, so the version-specific
  # entries above do not constrain anything either. The overrides block below is what
  # actually pins the resolved version.
  - js-yaml
overrides:
  '@protobufjs/utf8': 1.1.1
  axios: 1.18.0
  bn.js: 4.12.3
  cookie: 0.7.0
  fast-uri: 3.1.6
  follow-redirects: 1.16.0
  js-cookie: 3.0.7
  lodash: 4.18.1
  serialize-javascript: 7.0.5
  socket.io-parser: 4.2.7
  tmp: 0.2.7
  undici: 6.28.0
  adm-zip@<0.6.0: 0.6.0
  form-data@>=4.0.0 <4.0.6: 4.0.6
  '@babel/core@<=7.29.0': 7.29.6
  js-yaml@<3.15.1: 3.15.1
  js-yaml@>=4.0.0 <4.3.1: 4.3.1
  # Route every legacy consumer through the patched 5.x implementation.
  # The package patch preserves the callable CommonJS API expected by 1.x and 2.x consumers.
  brace-expansion: 5.0.9
  body-parser@>=2 <2.3.0: 2.3.0
  qs: 6.16.0
  browserslist: 4.28.7
  '@humanfs/node': 0.16.8
  uuid@<11.1.1: 11.1.1
  ws@>=7 <7.5.11: 7.5.11
  ws@>=8 <8.20.1: 8.21.0
  immutable: 4.3.9
  # Dedupe graphql to a single instance. @subsquid/openreader builds the schema
  # while @subsquid/graphql-server merges it; when they resolve different graphql
  # patch versions, cross-instance `instanceof` checks fail and mergeSchemas throws
  # "Unknown type Query". One graphql version keeps the indexer GraphQL API working
  # without patching @subsquid/graphql-server.
  graphql: 15.10.2

patchedDependencies:
  brace-expansion@5.0.9: patches/brace-expansion@5.0.9.patch
