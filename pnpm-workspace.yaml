packages:
  - auth
  - contracts
  - gateway
  - indexer
  - oracle
  - relayer
  - sdk
  - shared-http
  - shared-edge
  - shared-db
  - shared-auth
  - reconciliation
  - notifications
  - ricardian
  - treasury

linkWorkspacePackages: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Security fix for GHSA-7q85-xj36-vmfc. Keep the exception version-specific.
  - adm-zip@0.6.1
  # Security fixes for GHSA-q2hr-2g5m-vwhr, GHSA-qhr7-859c-m2p7, and
  # GHSA-6j4f-fj2g-mc7p. Keep the exception version-specific.
  - brace-expansion@5.0.12
  # Security fix for GHSA-hrr3-gc8f-f4qj. Keep the exception version-specific.
  - fast-uri@3.1.8
  # Security fixes for the axios advisories remediated in 1.20.0. Keep the
  # exception version-specific.
  - axios@1.20.0
  # Security fixes for GHSA-c83g-rgw3-j3cx and GHSA-73wf-gq98-2v4g.
  - browserslist@4.28.7
  # Security fix for GHSA-p498-v437-472g.
  - '@humanfs/node@0.16.8'
  # Security fixes for GHSA-x5fp-wj9c-mxmx and GHSA-4mjr-xmp4-gh2g.
  - qs@6.16.0
  # Security fixes for GHSA-8xcm-r25x-g524, GHSA-m8rv-5g2x-5cg5,
  # GHSA-v3r7-h72x-cjcm and GHSA-3wwx-pv8p-q78v.
  # Keep the exception version-specific for transitive dependencies requiring undici <7.
  - undici@6.28.1
  # Security fix for GHSA-2m8v-j782-fhvr. Keep the exception version-specific.
  - socket.io-parser@4.2.7
  # Security fixes for GHSA-5p4m-2wfm-xmqj and GHSA-2883-xcg3-v3hh. The patched
  # 3.15.2 and 4.3.2 releases are inside the 10080-minute window. Listed by bare
  # name because pnpm 10 matches this setting on package name only. The overrides
  # block below pins the resolved version.
  - js-yaml
overrides:
  # GHSA-7mx3-vvmw-hjmv affects every earlier GraphQL Tools utils major (PR #865).
  '@graphql-tools/utils@<=12.0.0': 12.0.1
  '@babel/core@<=7.29.0': 7.29.6
  '@humanfs/node': 0.16.8
  '@protobufjs/utf8': 1.1.1
  adm-zip: 0.6.1
  axios: 1.20.0
  bn.js: 4.12.3
  body-parser@>=2 <2.3.0: 2.3.0
  # Route every legacy consumer through the patched 5.x implementation.
  # The package patch preserves the callable CommonJS API expected by 1.x and 2.x consumers.
  brace-expansion: 5.0.12
  browserslist: 4.28.7
  cookie: 0.7.0
  # Mocha 11 (Hardhat 2.29) uses diff 7, affected by GHSA-73rr-hh4g-fpgx.
  diff@>=6 <8.0.3: 8.0.3
  fast-uri: 3.1.8
  follow-redirects: 1.16.0
  form-data@>=4.0.0 <4.0.6: 4.0.6
  # Dedupe graphql to a single instance. @subsquid/openreader builds the schema
  # while @subsquid/graphql-server merges it; when they resolve different graphql
  # patch versions, cross-instance `instanceof` checks fail and mergeSchemas throws
  # "Unknown type Query". One graphql version keeps the indexer GraphQL API working
  # without patching @subsquid/graphql-server.
  graphql: 15.10.2
  immutable: 4.3.9
  js-cookie: 3.0.7
  js-yaml@<3.15.2: 3.15.2
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  lodash: 4.18.1
  # GHSA-477h-4r7f-fvrx affects long-password hashing in older pbkdf2 releases.
  pbkdf2@<=3.1.6: 3.1.7
  qs: 6.16.0
  # GHSA-jqcg-44mw-7w3h affects the Express trust-proxy dependency (PR #865).
  proxy-addr@<2.0.8: 2.0.8
  serialize-javascript: 7.0.5
  socket.io-parser: 4.2.7
  tmp: 0.2.7
  undici@<7: 6.28.1
  uuid@<11.1.1: 11.1.1
  ws@>=7 <7.5.11: 7.5.11
  ws@>=8 <8.20.1: 8.21.0

patchedDependencies:
  '@subsquid/typeorm-store@1.9.2': patches/@subsquid__typeorm-store@1.9.2.patch
  brace-expansion@5.0.12: patches/brace-expansion@5.0.12.patch
  braces@3.0.3: patches/braces@3.0.3.patch
  stream-json@1.9.1: patches/stream-json@1.9.1.patch
preferWorkspacePackages: true
