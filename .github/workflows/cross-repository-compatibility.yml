name: Cross-repository compatibility

on:
  workflow_call:
    secrets:
      CI_APP_PRIVATE_KEY:
        description: GitHub App private key (PEM)
        required: true
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: cross-repository-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ci/cross-repository-compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Mint cross-repository read token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Agroasys
          repositories: |
            agroasys-backend
            platform.v1
            Cotsel.dash
          permission-contents: read

      - name: Check out Cotsel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: Cotsel

      - name: Resolve pinned repository commits
        id: manifest
        working-directory: Cotsel
        run: node scripts/check-cross-repo-release-manifest.mjs --github-outputs

      - name: Check out Agroasys backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Agroasys/agroasys-backend
          ref: ${{ steps.manifest.outputs.backend_commit }}
          token: ${{ steps.app-token.outputs.token }}
          path: agroasys-backend

      - name: Check out platform.v1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Agroasys/platform.v1
          ref: ${{ steps.manifest.outputs.platform_commit }}
          token: ${{ steps.app-token.outputs.token }}
          path: platform.v1

      - name: Check out Cotsel-Dash
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Agroasys/Cotsel.dash
          ref: ${{ steps.manifest.outputs.dashboard_commit }}
          token: ${{ steps.app-token.outputs.token }}
          path: Cotsel-Dash

      - name: Verify pinned checkouts and provider fixture parity
        working-directory: Cotsel
        env:
          AGROASYS_BACKEND_REPO_DIR: ${{ github.workspace }}/agroasys-backend
          PLATFORM_V1_REPO_DIR: ${{ github.workspace }}/platform.v1
          COTSEL_DASH_REPO_DIR: ${{ github.workspace }}/Cotsel-Dash
        run: node scripts/check-cross-repo-release-manifest.mjs --verify-checkouts

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          registry-url: https://npm.pkg.github.com
          scope: '@agroasys'

      - name: Enable Corepack
        run: corepack enable

      - name: Install Cotsel dependencies
        working-directory: Cotsel
        run: pnpm install --frozen-lockfile

      - name: Install Agroasys backend dependencies
        working-directory: agroasys-backend
        run: pnpm install --frozen-lockfile

      - name: Generate Agroasys backend Prisma client
        working-directory: agroasys-backend
        run: pnpm exec prisma generate

      - name: Install Cotsel-Dash dependencies
        working-directory: Cotsel-Dash
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install platform.v1 dependencies
        working-directory: platform.v1
        run: pnpm install --frozen-lockfile

      - name: Run Agroasys backend provider contracts
        working-directory: agroasys-backend
        run: pnpm run test:contract

      - name: Run platform.v1 consumer contracts
        working-directory: platform.v1
        run: pnpm run test:contract

      - name: Run Cotsel settlement provider contract
        working-directory: Cotsel
        run: pnpm --filter gateway run test -- settlementProviderContract.test.ts

      - name: Run M3 continuity contracts
        working-directory: Cotsel
        env:
          AGROASYS_BACKEND_REPO_DIR: ${{ github.workspace }}/agroasys-backend
          DASHBOARD_LIVE_SUITE_REPO_DIR: ${{ github.workspace }}/Cotsel-Dash
        run: pnpm run m3:continuity:ci
