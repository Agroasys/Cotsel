name: DCO Check

on:
  pull_request:

concurrency:
  group: cotsel-dco-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: dco/check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Validate DCO sign-offs across PR commits
        shell: bash
        run: |
          set -euo pipefail

          # The event payload can retain the base SHA from before a PR is
          # rebased. Resolve the live target branch and its merge-base so a
          # signed main-branch merge is never inspected as a PR commit.
          base_ref="${{ github.event.pull_request.base.ref }}"
          base_sha="$(git rev-parse "origin/${base_ref}")"
          head_sha="${{ github.event.pull_request.head.sha }}"
          merge_base="$(git merge-base "${base_sha}" "${head_sha}")"

          missing=0
          while IFS= read -r commit_sha; do
            [[ -z "$commit_sha" ]] && continue

            if ! git log -1 --format=%B "$commit_sha" | grep -qi '^Signed-off-by:'; then
              echo "missing DCO sign-off: $commit_sha" >&2
              git log -1 --format='%h %s' "$commit_sha" >&2
              missing=1
            fi
          done < <(git rev-list "${merge_base}..${head_sha}")

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
