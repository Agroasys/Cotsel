name: Archive Base Sepolia Evidence

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Exact Base Sepolia candidate identifier.
        required: true
        type: string
      evidence_sha256:
        description: SHA-256 of the redacted evidence packet to archive.
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: archive/preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: base-sepolia-evidence
    permissions:
      contents: read
      id-token: write
    env:
      ARCHIVE_BUCKET: ${{ vars.COTSEL_BASE_SEPOLIA_EVIDENCE_BUCKET }}
      WRITER_ROLE_ARN: ${{ vars.COTSEL_BASE_SEPOLIA_EVIDENCE_WRITER_ROLE_ARN }}
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate the archive request
        id: request
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_ID" =~ ^cotsel-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9]{4,16}$ ]] || {
            echo 'candidate_id must use the evidence-index candidate format.' >&2
            exit 1
          }
          [[ "$EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo 'evidence_sha256 must be a lowercase SHA-256 digest.' >&2
            exit 1
          }
          test -n "$ARCHIVE_BUCKET" || {
            echo 'The protected environment does not define COTSEL_BASE_SEPOLIA_EVIDENCE_BUCKET.' >&2
            exit 1
          }
          test -n "$WRITER_ROLE_ARN" || {
            echo 'The protected environment does not define COTSEL_BASE_SEPOLIA_EVIDENCE_WRITER_ROLE_ARN.' >&2
            exit 1
          }
          printf 'candidate_prefix=base-sepolia/staging/candidates/%s/\n' "$CANDIDATE_ID" >> "$GITHUB_OUTPUT"

      - name: Assume the archive writer role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ env.WRITER_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify writer access is limited to the candidate prefix
        env:
          CANDIDATE_PREFIX: ${{ steps.request.outputs.candidate_prefix }}
        run: |
          set -euo pipefail
          aws s3api list-objects-v2 \
            --bucket "$ARCHIVE_BUCKET" \
            --prefix "$CANDIDATE_PREFIX" \
            --max-keys 1 \
            --output json >/dev/null
          echo "Archive writer preflight passed for $CANDIDATE_PREFIX."
