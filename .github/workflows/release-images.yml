name: Release Images

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  artifact-metadata: write
  attestations: write
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  PUSH_ROLE_ARN: arn:aws:iam::655177116834:role/agroasys-cotsel-github-ecr-push

concurrency:
  # New PR commits supersede obsolete candidate images. Each mainline commit
  # keeps a distinct group so a later push cannot cancel immutable release work.
  group: release-images-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  registry-ready:
    name: release/registry-ready
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate the authoritative release inventory
        run: node --test scripts/tests/release-candidate-inventory.test.mjs

      - name: Assume the Cotsel image-publish role
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify the complete ECR repository cohort
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mapfile -t repositories < <(node -e '
            const inventory = require("./integration/release-candidate-inventory.json");
            for (const artifact of inventory.artifacts) {
              if (artifact.kind === "container-image" && artifact.sourceRepository === "Agroasys/Cotsel") {
                console.log(artifact.repository);
              }
            }
          ')
          test "${#repositories[@]}" -eq 9 || {
            echo "Expected nine Cotsel release repositories, found ${#repositories[@]}." >&2
            exit 1
          }
          aws ecr describe-repositories \
            --repository-names "${repositories[@]}" \
            --query 'sort_by(repositories,&repositoryName)[].{name:repositoryName,mutability:imageTagMutability,encryption:encryptionConfiguration.encryptionType,scanOnPush:imageScanningConfiguration.scanOnPush}' \
            --output table

  build:
    name: build/${{ matrix.service }}
    needs: registry-ready
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            repository: cotsel/auth
            dockerfile: auth/Dockerfile
            local_tag: cotsel-auth
          - service: gateway
            repository: cotsel/gateway
            dockerfile: gateway/Dockerfile
            local_tag: cotsel-gateway
          - service: indexer-graphql
            repository: cotsel/indexer-graphql
            dockerfile: indexer/Dockerfile
            local_tag: cotsel-indexer-graphql
          - service: indexer-pipeline
            repository: cotsel/indexer-pipeline
            dockerfile: indexer/Dockerfile
            local_tag: cotsel-indexer-pipeline
          - service: oracle
            repository: cotsel/oracle
            dockerfile: oracle/Dockerfile
            local_tag: cotsel-oracle
          - service: reconciliation
            repository: cotsel/reconciliation
            dockerfile: reconciliation/Dockerfile
            local_tag: cotsel-reconciliation
          - service: relayer
            repository: cotsel/relayer
            dockerfile: relayer/Dockerfile
            local_tag: cotsel-relayer
          - service: ricardian
            repository: cotsel/ricardian
            dockerfile: ricardian/Dockerfile
            local_tag: cotsel-ricardian
          - service: treasury
            repository: cotsel/treasury
            dockerfile: treasury/Dockerfile
            local_tag: cotsel-treasury

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Decide whether this build publishes
        id: kind
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Assume the Cotsel image-publish role
        if: steps.kind.outputs.publish == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        if: steps.kind.outputs.publish == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd

      - name: Reuse an existing image for this commit
        id: existing
        if: steps.kind.outputs.publish == 'true'
        env:
          ECR_REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)
          if [ -n "$DIGEST" ] && [ "$DIGEST" != "None" ]; then
            echo "Commit $GITHUB_SHA is already published for $ECR_REPOSITORY as $DIGEST."
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        id: build
        if: steps.kind.outputs.publish == 'true' && steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}:${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Build without publishing
        if: steps.kind.outputs.publish != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: false
          load: true
          tags: ${{ matrix.local_tag }}:${{ github.sha }}
          provenance: false

      - name: Settle artifact identity
        id: identity
        env:
          BUILT: ${{ steps.build.outputs.digest }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ matrix.repository }}
          LOCAL_TAG: ${{ matrix.local_tag }}
          PUBLISH: ${{ steps.kind.outputs.publish }}
          REUSED: ${{ steps.existing.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" != "true" ]; then
            echo "name=${LOCAL_TAG}" >> "$GITHUB_OUTPUT"
            echo "reference=${LOCAL_TAG}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "provenance_generated=false" >> "$GITHUB_OUTPUT"
            echo "reused_existing_digest=false" >> "$GITHUB_OUTPUT"
            echo "Candidate image for ${ECR_REPOSITORY}; not published."
            exit 0
          fi

          DIGEST="${REUSED:-$BUILT}"
          if [ -z "$DIGEST" ]; then
            echo "No digest from either the existing image or the build." >&2
            exit 1
          fi

          NAME="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          REFERENCE="${ECR_REGISTRY}/${ECR_REPOSITORY}@${DIGEST}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "reference=$REFERENCE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          if [ -n "$REUSED" ]; then
            echo "provenance_generated=false" >> "$GITHUB_OUTPUT"
            echo "reused_existing_digest=true" >> "$GITHUB_OUTPUT"
          else
            echo "provenance_generated=true" >> "$GITHUB_OUTPUT"
            echo "reused_existing_digest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Image identity: $REFERENCE"

      - name: Generate SPDX image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          image: ${{ steps.identity.outputs.reference }}
          format: spdx-json
          output-file: sbom-image-${{ matrix.service }}.spdx.json
          upload-artifact: false

      - name: Install Cosign
        if: steps.kind.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - name: Sign and verify the published image digest
        id: signature
        if: steps.kind.outputs.publish == 'true'
        env:
          IMAGE_REFERENCE: ${{ steps.identity.outputs.reference }}
        run: |
          set -euo pipefail
          SIGNATURE_PATH="signature-image-${{ matrix.service }}.json"
          TEMP_SIGNATURE_PATH="${SIGNATURE_PATH}.tmp"
          cosign sign --yes "$IMAGE_REFERENCE"
          cosign verify \
            --certificate-identity "https://github.com/Agroasys/Cotsel/.github/workflows/release-images.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_REFERENCE" > "$TEMP_SIGNATURE_PATH"
          node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!Array.isArray(payload) || payload.length === 0) {
              throw new Error("Cosign verification returned no signatures");
            }
          ' "$TEMP_SIGNATURE_PATH"
          mv "$TEMP_SIGNATURE_PATH" "$SIGNATURE_PATH"
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Reject high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ steps.identity.outputs.reference }}
          format: json
          output: scan-image-${{ matrix.service }}.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true

      - name: Generate SPDX image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ steps.identity.outputs.reference }}
          format: spdx-json
          output: sbom-${{ matrix.service }}.spdx.json
          hide-progress: true

      - name: Attest image provenance
        id: provenance
        if: steps.kind.outputs.publish == 'true' && steps.build.outputs.digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.identity.outputs.name }}
          subject-digest: ${{ steps.identity.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        id: sbom_attestation
        if: steps.kind.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.identity.outputs.name }}
          subject-digest: ${{ steps.identity.outputs.digest }}
          sbom-path: sbom-${{ matrix.service }}.spdx.json
          push-to-registry: true

      - name: Preserve signed provenance bundle
        if: steps.kind.outputs.publish == 'true' && steps.build.outputs.digest != ''
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" "provenance-${SERVICE}.sigstore.json"

      - name: Preserve signed SBOM bundle
        if: steps.kind.outputs.publish == 'true'
        env:
          SBOM_BUNDLE: ${{ steps.sbom_attestation.outputs.bundle-path }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          cp "$SBOM_BUNDLE" "sbom-attestation-${SERVICE}.sigstore.json"

      - name: Verify signed image attestations
        if: steps.kind.outputs.publish == 'true'
        env:
          CERT_IDENTITY: https://github.com/Agroasys/Cotsel/.github/workflows/release-images.yml@refs/heads/main
          GH_TOKEN: ${{ github.token }}
          REFERENCE: ${{ steps.identity.outputs.reference }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${REFERENCE}" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$CERT_IDENTITY" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --format json \
            > "attestation-verification-${SERVICE}.json"
          gh attestation verify "oci://${REFERENCE}" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$CERT_IDENTITY" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --deny-self-hosted-runners \
            --format json \
            > "sbom-attestation-verification-${SERVICE}.json"

      - name: Resolve producing workflow identity
        id: producing
        if: steps.kind.outputs.publish == 'true'
        env:
          IMAGE_BUILT: ${{ steps.build.outputs.digest != '' }}
          PROVENANCE_VERIFICATION: attestation-verification-${{ matrix.service }}.json
        run: |
          set -euo pipefail
          node scripts/resolve-release-image-provenance.mjs

      - name: Record image evidence
        if: always()
        env:
          DIGEST: ${{ steps.identity.outputs.digest }}
          IMAGE_REUSED: ${{ steps.producing.outputs.image_reused }}
          PROVENANCE_ATTESTATION_ID: ${{ steps.provenance.outputs.attestation-id }}
          PROVENANCE_ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
          PRODUCING_RUN_ID: ${{ steps.producing.outputs.producing_run_id }}
          PRODUCING_RUN_URI: ${{ steps.producing.outputs.producing_run_uri }}
          REFERENCE: ${{ steps.identity.outputs.reference }}
          SBOM_ATTESTATION_ID: ${{ steps.sbom_attestation.outputs.attestation-id }}
          SBOM_ATTESTATION_URL: ${{ steps.sbom_attestation.outputs.attestation-url }}
          SERVICE: ${{ matrix.service }}
          PUBLISHED: ${{ steps.kind.outputs.publish }}
          PROVENANCE_GENERATED: ${{ steps.identity.outputs.provenance_generated }}
          REUSED_EXISTING_DIGEST: ${{ steps.identity.outputs.reused_existing_digest }}
          SIGNATURE_VERIFIED: ${{ steps.signature.outputs.verified }}
        run: |
          node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const sbomPath = `sbom-image-${process.env.SERVICE}.spdx.json`;
            const sbomSha256 = fs.existsSync(sbomPath)
              ? crypto.createHash("sha256").update(fs.readFileSync(sbomPath)).digest("hex")
              : null;
            const published = process.env.PUBLISHED === "true";
            const provenanceGenerated = process.env.PROVENANCE_GENERATED === "true";
            const reusedExistingDigest = process.env.REUSED_EXISTING_DIGEST === "true";
            const signatureVerified = process.env.SIGNATURE_VERIFIED === "true";
            const out = {
              service: process.env.SERVICE,
              sourceCommit: process.env.GITHUB_SHA,
              imageReference: process.env.REFERENCE,
              imageDigest: process.env.DIGEST || null,
              published,
              buildProvenance: provenanceGenerated
                ? { mode: "max", producingWorkflowRunId: process.env.PRODUCING_RUN_ID }
                : null,
              reusedExistingDigest,
              sbom: fs.existsSync(sbomPath) ? { path: sbomPath, sha256: sbomSha256 } : null,
              signatureVerified: published ? signatureVerified : null,
              imageReused: process.env.IMAGE_REUSED === "true",
              workflowRunId: process.env.PRODUCING_RUN_ID || null,
              producingWorkflowRunUri: process.env.PRODUCING_RUN_URI || null,
              verificationWorkflowRunId: process.env.GITHUB_RUN_ID,
              provenanceAttestationId: process.env.PROVENANCE_ATTESTATION_ID || null,
              provenanceAttestationUrl: process.env.PROVENANCE_ATTESTATION_URL || null,
              sbomAttestationId: process.env.SBOM_ATTESTATION_ID || null,
              sbomAttestationUrl: process.env.SBOM_ATTESTATION_URL || null,
            };
            fs.writeFileSync(`release-image-${out.service}.json`, `${JSON.stringify(out, null, 2)}\n`);
          '

      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: cotsel-image-${{ matrix.service }}-${{ github.sha }}
          path: |
            release-image-${{ matrix.service }}.json
            sbom-image-${{ matrix.service }}.spdx.json
            signature-image-${{ matrix.service }}.json
            scan-image-${{ matrix.service }}.json
            sbom-${{ matrix.service }}.spdx.json
            provenance-${{ matrix.service }}.sigstore.json
            sbom-attestation-${{ matrix.service }}.sigstore.json
            attestation-verification-${{ matrix.service }}.json
            sbom-attestation-verification-${{ matrix.service }}.json
          retention-days: 90
