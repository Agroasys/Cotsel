name: Contract Deployment Evidence

on:
  workflow_dispatch:
    inputs:
      action:
        description: Build a contract bundle, prepare an unsigned request, or verify an existing deployment.
        required: true
        default: prepare
        type: choice
        options:
          - bundle
          - prepare
          - verify
      commit_sha:
        description: Exact reviewed main commit.
        required: true
        type: string
      deployment_tx_hash:
        description: Required only for verify. Transaction broadcast by the approved hardware wallet.
        required: false
        type: string
      forbidden_user_wallets:
        description: Optional comma-separated buyer and supplier wallets that must not hold a protocol role.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.action == 'bundle' && 'contract-bundle-base-sepolia' || 'contract-deployment-evidence-base-sepolia' }}
  cancel-in-progress: false

jobs:
  bundle:
    name: contract/base-sepolia/bundle
    if: inputs.action == 'bundle'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout the requested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify immutable build selection
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 10.34.4

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Require exact-main release checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sdk-source-gate.mjs

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile and package the verified escrow
        run: |
          set -euo pipefail
          export CONTRACT_BUNDLE_OUT_DIR="$RUNNER_TEMP/contract-bundle"
          pnpm --dir contracts run compile
          pnpm --dir contracts exec hardhat test --no-compile scripts/tests/contractBundle.ts
          test -z "$(git status --porcelain --untracked-files=all)"
          pnpm --dir contracts exec hardhat run --no-compile scripts/build-contract-bundle.ts
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf AgroasysEscrow.tgz -C "$CONTRACT_BUNDLE_OUT_DIR" .

      - name: Attest the exact archive
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: AgroasysEscrow.tgz

      - name: Verify and retain provenance and release receipt
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          identity=https://github.com/Agroasys/Cotsel/.github/workflows/contract-deploy.yml@refs/heads/main
          cp "$PROVENANCE_BUNDLE" provenance.sigstore.json
          gh attestation verify AgroasysEscrow.tgz --repo "$GITHUB_REPOSITORY" \
            --bundle provenance.sigstore.json --cert-identity "$identity" --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" --deny-self-hosted-runners --format json \
            > provenance-verification.json
          sha256sum AgroasysEscrow.tgz provenance.sigstore.json provenance-verification.json \
            > sha256sums.txt
          jq -n \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg producingRunId "$GITHUB_RUN_ID" \
            --arg producingRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg producingWorkflow .github/workflows/contract-deploy.yml \
            --arg certificateIdentity "$identity" \
            --arg archiveSha256 "$(sha256sum AgroasysEscrow.tgz | cut -d ' ' -f1)" \
            --arg provenanceSha256 "$(sha256sum provenance.sigstore.json | cut -d ' ' -f1)" \
            --arg verificationSha256 "$(sha256sum provenance-verification.json | cut -d ' ' -f1)" \
            --slurpfile manifest "$RUNNER_TEMP/contract-bundle/release-manifest.json" \
            '{
              sourceCommit: $sourceCommit,
              producingRunId: $producingRunId,
              producingRunAttempt: $producingRunAttempt,
              producingWorkflow: $producingWorkflow,
              certificateIdentity: $certificateIdentity,
              archiveSha256: $archiveSha256,
              provenanceSha256: $provenanceSha256,
              verificationSha256: $verificationSha256,
              sbom: $manifest[0].sbom
            }' > release-receipt.json

      - name: Retain the verified contract bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cotsel-contract-bundle-${{ github.sha }}
          path: |
            AgroasysEscrow.tgz
            provenance.sigstore.json
            provenance-verification.json
            release-receipt.json
            sha256sums.txt
          if-no-files-found: error
          retention-days: 90

  evidence:
    name: contract/base-sepolia/${{ inputs.action }}
    if: inputs.action == 'prepare' || inputs.action == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      SIGNER_AUDIT_ROLE_ARN: arn:aws:iam::655177116834:role/agroasys-cotsel-contract-deploy
      BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
      BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
      DEPLOYER_ADDRESS: ${{ vars.COTSEL_STAGING_DEPLOYER_ADDRESS }}
      DEPLOY_ORACLE_ADDRESS: ${{ vars.COTSEL_STAGING_ORACLE_KMS_EXPECTED_ADDRESS }}
      DEPLOY_TREASURY_ADDRESS: ${{ vars.COTSEL_STAGING_TREASURY_ADDRESS }}
      DEPLOY_RELAYER_ADDRESS: ${{ vars.COTSEL_STAGING_RELAYER_KMS_EXPECTED_ADDRESS }}
      DEPLOY_ADMINS: ${{ vars.COTSEL_STAGING_ADMIN_1_ADDRESS }},${{ vars.COTSEL_STAGING_ADMIN_2_ADDRESS }},${{ vars.COTSEL_STAGING_ADMIN_3_ADDRESS }}
      DEPLOY_REQUIRED_APPROVALS: '2'
      DEPLOY_VERIFY: 'true'
      DEPLOY_TRANSACTION_HASH: ${{ inputs.deployment_tx_hash }}
      DEPLOY_FORBIDDEN_USER_WALLETS: ${{ inputs.forbidden_user_wallets }}
    steps:
      - name: Checkout the requested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify immutable deployment selection
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Contract deployment evidence is restricted to main." >&2
            exit 1
          }
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT_SHA" || {
            echo "The dispatched commit does not match the reviewed main commit." >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA" || {
            echo "The checkout does not match the reviewed commit." >&2
            exit 1
          }
          test -z "$(git status --porcelain --untracked-files=all)" || {
            echo "The deployment checkout is not clean." >&2
            exit 1
          }
          if [ "${{ inputs.action }}" = "verify" ]; then
            test -n "$DEPLOY_TRANSACTION_HASH" || {
              echo "deployment_tx_hash is required for verify." >&2
              exit 1
            }
          fi

      - name: Check protected configuration
        run: |
          set -euo pipefail
          for name in \
            BASE_SEPOLIA_RPC_URL \
            BASESCAN_API_KEY \
            DEPLOYER_ADDRESS \
            DEPLOY_ORACLE_ADDRESS \
            DEPLOY_TREASURY_ADDRESS \
            DEPLOY_RELAYER_ADDRESS \
            DEPLOY_ADMINS; do
            test -n "${!name:-}" || {
              echo "$name is not configured in the protected staging environment." >&2
              exit 1
            }
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 10.34.4

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Revalidate the contract candidate
        run: |
          pnpm --dir contracts run compile
          pnpm --dir contracts run test

      - name: Assume the signer-audit role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.SIGNER_AUDIT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify the automated KMS signers
        run: |
          mkdir -p contracts/reports/deploy/base-sepolia
          pnpm --dir contracts run kms:verify-automated-signers \
            > contracts/reports/deploy/base-sepolia/kms-automated-signers.json

      - name: Prepare the unsigned hardware-wallet request
        if: inputs.action == 'prepare'
        run: pnpm --dir contracts run prepare:base-sepolia

      - name: Verify the hardware-wallet deployment
        if: inputs.action == 'verify'
        run: pnpm --dir contracts run finalize:base-sepolia

      - name: Retain deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: base-sepolia-contract-${{ inputs.action }}-${{ github.sha }}-${{ github.run_id }}
          path: contracts/reports/deploy/base-sepolia/*.json
          if-no-files-found: error
          retention-days: 90
