version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: 'UTC'
    # Match pnpm's seven-day minimum release age. This applies to version
    # updates only; Dependabot security updates remain immediate.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # Temporary Hardhat v3 migration deferral (issue #192):
      # keep major updates muted only for the blocked Hardhat plugin chain.
      - dependency-name: 'hardhat'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@parity/hardhat-polkadot'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@parity/hardhat-polkadot-resolc'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@nomicfoundation/hardhat-toolbox'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@nomicfoundation/hardhat-ethers'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@nomicfoundation/hardhat-chai-matchers'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@nomicfoundation/hardhat-ignition'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@nomicfoundation/hardhat-ignition-ethers'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@nomicfoundation/hardhat-network-helpers'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@nomicfoundation/hardhat-verify'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@typechain/hardhat'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'hardhat-gas-reporter'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'solidity-coverage'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'chai'
        update-types:
          - 'version-update:semver-major'
    groups:
      # Group only low-risk SemVer updates. Keep ox out of the routine group:
      # Dependabot classified its observed 0.x-to-1.x update as routine, but it
      # violates permissionless' current peer range and needs a focused review.
      npm-runtime:
        applies-to: version-updates
        patterns:
          - '*'
        exclude-patterns:
          - 'ox'
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-dev:
        applies-to: version-updates
        patterns:
          - '*'
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
