name: Cotsel production-readiness work package
description: Create a parent control issue for a complete SOW work package.
title: '[WP-X] '
labels: ['programme:cotsel-production-readiness', 'status:backlog', 'type:work-package']
assignees: []
body:
  - type: textarea
    id: control_sheet
    attributes:
      label: Work-package control sheet
      description: Preserve these nine SOW fields in this exact order. Do not substitute Project metadata for a required field.
      value: |
        | Control | Definition |
        |---|---|
        | Objective |  |
        | In scope / out of scope |  |
        | Owner / reviewers |  |
        | Dependencies |  |
        | Implementation |  |
        | Verification |  |
        | Acceptance evidence |  |
        | Rollback / containment |  |
        | Residual risk |  |
    validations: { required: true }
  - type: textarea
    id: programme_metadata
    attributes:
      label: Programme metadata
      value: |
        Primary gate:
        Programme track:
        Milestone:
        Risk:
        Working lead / GitHub assignee:
        Delivery reviewer:
    validations: { required: true }
  - type: textarea
    id: requirements
    attributes:
      label: Required work, implementation requirement, and acceptance evidence
      description: Use source-faithful, control-specific content for every row. Generic implementation or evidence boilerplate is prohibited.
      value: |
        | ID | Required work | Implementation requirement | Acceptance evidence |
        |---|---|---|---|
        |  |  |  |  |
    validations: { required: true }
  - type: textarea
    id: children
    attributes:
      label: Child delivery issues and dependencies
      description: List every child, predecessor, external dependency, finding ID, and supporting control ID.
    validations: { required: true }
  - type: textarea
    id: exit
    attributes:
      label: Exit, rollback, residual risk, and invalidation
      description: Define accepted evidence, authority, containment, remaining risk, and the changes that reopen the package.
    validations: { required: true }
