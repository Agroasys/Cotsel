name: Cotsel production-readiness external dependency
description: Track evidence or delivery owned outside the Cotsel implementation boundary.
title: '[WP-X/External] '
labels: ['programme:cotsel-production-readiness', 'status:backlog', 'type:external-dependency']
assignees: []
body:
  - type: textarea
    id: outcome
    attributes:
      label: Required external outcome
      description: State what must be supplied and why the Cotsel programme cannot self-accept it.
    validations: { required: true }
  - type: textarea
    id: requirements
    attributes:
      label: Required work, implementation requirement, and acceptance evidence
      description: Use source-faithful, dependency-specific content. Generic implementation or evidence boilerplate is prohibited.
      value: |
        | ID | Required work | Implementation requirement | Acceptance evidence |
        |---|---|---|---|
        |  |  |  |  |
    validations: { required: true }
  - type: textarea
    id: interface
    attributes:
      label: Interface, artifact, and authority boundary
      description: Name the contract, owner, version, environment, provider mode, repository or system, and source of truth.
    validations: { required: true }
  - type: textarea
    id: current_state
    attributes:
      label: Current verified state
      description: Separate inspected evidence, supplied claims, unknowns, blocked access, and the exact external state that still requires confirmation.
    validations: { required: true }
  - type: textarea
    id: ownership
    attributes:
      label: Ownership
      value: |
        External delivery authority:
        Cotsel accountable owner:
        Acceptance owner:
        Working lead / GitHub assignee: select from the parent work package
        Delivery reviewer: the other participant
    validations: { required: true }
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and sequencing
      description: Link the primary Cotsel issue, external owner, provider or repository work, access prerequisites, decision dependencies, delivery sequence, and blocker escalation.
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and failure cases
      description: Define observable integration, rejection, timeout, drift, rollback and recovery criteria without allowing Cotsel to self-accept the external result.
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Evidence supplier, artifacts, and reviewer
      description: Name the external evidence supplier, immutable artifacts or receipts, environment, release identity, producing run, acceptance owner and independent reviewer.
    validations: { required: true }
  - type: textarea
    id: closure
    attributes:
      label: Closure and invalidation rule
      description: State that Cotsel coordination cannot self-accept external proof; name the acceptance authority and change triggers.
    validations: { required: true }
