name: Cotsel release gate review
description: Accept or reject one engineering, pilot, or mainnet gate for an exact candidate release.
title: '[Gate/Release ID] '
labels:
  [
    'programme:cotsel-production-readiness',
    'status:evidence-review',
    'type:gate-review',
    'sow:gate',
  ]
assignees: [Astton, czpyioe]
body:
  - type: dropdown
    id: gate_id
    attributes:
      label: Gate ID
      description: Select the exact engineering, pilot, or mainnet authorization being reviewed.
      options: [E-0, E-1, E-2, E-3, E-4, E-5, P-0, P-1, P-2, P-3, P-4, P-5, P-6, Mainnet]
    validations: { required: true }
  - type: input
    id: release_id
    attributes:
      label: Target release ID
      description: Exact immutable release-manifest identifier.
    validations: { required: true }
  - type: textarea
    id: identity
    attributes:
      label: Candidate identity
      description: Name source commits, image and artifact digests, contract addresses, deployment block, ABI and bytecode hashes, infrastructure and migration identities, chain, providers, environment, and rollback target.
    validations: { required: true }
  - type: textarea
    id: requirements
    attributes:
      label: Required work, implementation requirement, and acceptance evidence
      description: Copy the complete source-faithful gate definition from the validated programme contract. Generic boilerplate is prohibited.
      value: |
        | ID | Required work | Implementation requirement | Acceptance evidence |
        |---|---|---|---|
        |  |  |  |  |
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Evidence index and review
      description: Link immutable evidence, reproducible commands, failures, recovery, reviewer findings, exceptions, and invalidation triggers.
    validations: { required: true }
  - type: textarea
    id: authority
    attributes:
      label: Required approvers and separation of duty
      description: Name every SOW-required approver, evidence reviewer, delivery owner, and any party prohibited from self-accepting the gate.
    validations: { required: true }
  - type: textarea
    id: stop_condition
    attributes:
      label: Stop or no-go condition
      description: Record the exact SOW stop condition and the containment action while it is present.
    validations: { required: true }
  - type: textarea
    id: rollback
    attributes:
      label: Rollback, containment, and residual risk
      description: Name the rollback target, stop authority, reconciliation requirement, incident owner, remaining exposure, exceptions, compensating controls, and expiry.
    validations: { required: true }
  - type: textarea
    id: decision
    attributes:
      label: Gate decision
      value: |
        Decision: Accepted / Rejected
        Acceptance authority:
        Review date:
        Conditions or waivers:
        Expiry:
    validations: { required: true }
  - type: checkboxes
    id: declaration
    attributes:
      label: Reviewer declaration
      options:
        - label: I verified that all evidence belongs to the candidate identity above and that a merge or closed issue was not treated as readiness.
          required: true
        - label: I will reopen this review if the manifest, artifact, contract, migration, environment, provider mode, evidence, approver, exception, or rollback target changes materially.
          required: true
