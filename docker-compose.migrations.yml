services:
  auth-migrate:
    profiles: ['runtime']
    build:
      context: .
      dockerfile: auth/Dockerfile
    restart: 'no'
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: '${AUTH_DB_NAME}'
      DB_USER: '${AUTH_DB_MIGRATION_USER}'
      DB_PASSWORD: '${AUTH_DB_MIGRATION_PASSWORD}'
      DB_RUNTIME_USER: '${AUTH_DB_RUNTIME_USER}'
      DB_SSL_MODE: disable
      MIGRATION_DIRECTORY: /app/auth/src/database/migrations
      MIGRATION_LOCK_TIMEOUT_MS: '60000'
      MIGRATION_SERVICE_NAME: auth
      MIGRATION_STATEMENT_TIMEOUT_MS: '300000'
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    command: ['node', 'shared-db/migrate.js']

