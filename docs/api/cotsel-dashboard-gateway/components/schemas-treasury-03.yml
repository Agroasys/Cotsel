components:
  schemas:
    TreasuryPeriodRollforward:
      type: object
      required:
        - period
        - generated_at
        - opening_held_raw
        - new_accruals_raw
        - allocated_to_batches_raw
        - swept_onchain_raw
        - handed_off_raw
        - realized_raw
        - ending_held_raw
        - unresolved_exception_raw
        - blocking_issue_count
        - warning_issue_count
        - blocking_issues
        - warning_issues
      properties:
        period:
          $ref: '#/components/schemas/TreasuryAccountingPeriod'
        generated_at:
          type: string
          format: date-time
        opening_held_raw:
          type: string
        new_accruals_raw:
          type: string
        allocated_to_batches_raw:
          type: string
        swept_onchain_raw:
          type: string
        handed_off_raw:
          type: string
        realized_raw:
          type: string
        ending_held_raw:
          type: string
        unresolved_exception_raw:
          type: string
        blocking_issue_count:
          type: integer
          minimum: 0
        warning_issue_count:
          type: integer
          minimum: 0
        blocking_issues:
          type: array
          items:
            $ref: '#/components/schemas/TreasuryCloseIssue'
        warning_issues:
          type: array
          items:
            $ref: '#/components/schemas/TreasuryCloseIssue'
    TreasuryPeriodRollforwardResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/TreasuryPeriodRollforward'
        timestamp:
          type: string
          format: date-time
    TreasuryClaimEvent:
      type: object
      required:
        - id
        - source_event_id
        - tx_hash
        - block_number
        - observed_at
        - treasury_identity
        - payout_receiver
        - amount_raw
        - created_at
      properties:
        id:
          type: integer
          minimum: 1
        source_event_id:
          type: string
        matched_sweep_batch_id:
          type: integer
          nullable: true
        tx_hash:
          type: string
        block_number:
          type: integer
          minimum: 0
        observed_at:
          type: string
          format: date-time
        treasury_identity:
          type: string
        payout_receiver:
          type: string
        amount_raw:
          type: string
        triggered_by:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    TreasuryBatchTraceEntry:
      type: object
      required:
        - ledger_entry_id
        - trade_id
        - component_type
        - source_amount_raw
        - earned_at
        - accounting_state
        - accounting_state_reason
      properties:
        ledger_entry_id:
          type: integer
          minimum: 1
        trade_id:
          type: string
        component_type:
          type: string
        source_amount_raw:
          type: string
        allocated_amount_raw:
          type: string
          nullable: true
        earned_at:
          type: string
          format: date-time
        accounting_state:
          $ref: '#/components/schemas/TreasuryAccountingState'
        accounting_state_reason:
          type: string
        matched_sweep_tx_hash:
          type: string
          nullable: true
        matched_swept_at:
          type: string
          format: date-time
          nullable: true
        partner_reference:
          type: string
          nullable: true
        partner_handoff_status:
          oneOf:
            - $ref: '#/components/schemas/TreasuryPartnerHandoffStatus'
            - type: 'null'
        latest_bank_reference:
          type: string
          nullable: true
        latest_bank_payout_state:
          type: string
          nullable: true
        latest_bank_confirmed_at:
          type: string
          format: date-time
          nullable: true
        revenue_realization_status:
          oneOf:
            - $ref: '#/components/schemas/TreasuryRevenueRealizationStatus'
            - type: 'null'
        realized_at:
          type: string
          format: date-time
          nullable: true
    TreasuryBatchTraceReport:
      type: object
      required:
        - batch
        - claim_event
        - partner_handoff
        - totals
        - entries
        - blocking_issues
        - warning_issues
      properties:
        batch:
          $ref: '#/components/schemas/TreasurySweepBatch'
        claim_event:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TreasuryClaimEvent'
        partner_handoff:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TreasuryPartnerHandoff'
        totals:
          type: object
          required:
            - expected_total_raw
            - allocated_total_raw
            - entry_count
          properties:
            expected_total_raw:
              type: string
            allocated_total_raw:
              type: string
            entry_count:
              type: integer
              minimum: 0
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TreasuryBatchTraceEntry'
        blocking_issues:
          type: array
          items:
            $ref: '#/components/schemas/TreasuryCloseIssue'
        warning_issues:
          type: array
          items:
            $ref: '#/components/schemas/TreasuryCloseIssue'
    TreasuryBatchTraceReportResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/TreasuryBatchTraceReport'
        timestamp:
          type: string
          format: date-time
    TreasuryAccountingPeriodClosePacket:
      type: object
      required:
        - period
        - generated_at
        - ready_for_close
        - rollforward
        - reconciliation
        - batches
        - blocking_issues
        - warning_issues
      properties:
        period:
          $ref: '#/components/schemas/TreasuryAccountingPeriod'
        generated_at:
          type: string
          format: date-time
        ready_for_close:
          type: boolean
        rollforward:
          $ref: '#/components/schemas/TreasuryPeriodRollforward'
        reconciliation:
          type: object
          required:
            - status
            - freshness
            - latest_completed_run_key
            - latest_completed_run_at
            - stale_running_run_count
            - blocked_reasons
          properties:
            status:
              type: string
            freshness:
              type: string
              enum:
                - FRESH
                - STALE
                - MISSING
            latest_completed_run_key:
              type: string
              nullable: true
            latest_completed_run_at:
              type: string
              format: date-time
              nullable: true
            stale_running_run_count:
              type: integer
              minimum: 0
            blocked_reasons:
              type: array
              items:
                type: string
        batches:
          type: array
          items:
            $ref: '#/components/schemas/TreasuryBatchTraceReport'
        blocking_issues:
          type: array
          items:
            $ref: '#/components/schemas/TreasuryCloseIssue'
        warning_issues:
          type: array
          items:
            $ref: '#/components/schemas/TreasuryCloseIssue'
    TreasuryAccountingPeriodClosePacketResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/TreasuryAccountingPeriodClosePacket'
        timestamp:
          type: string
          format: date-time
    TreasuryEntryAccountingResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/TreasuryLedgerEntryAccountingProjection'
        timestamp:
          type: string
          format: date-time
    TreasuryEntryAccountingListResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/TreasuryLedgerEntryAccountingProjection'
        timestamp:
          type: string
          format: date-time
    TreasuryEntryRealizationRequest:
      type: object
      required:
        - accountingPeriodId
        - audit
      properties:
        accountingPeriodId:
          type: integer
          minimum: 1
        sweepBatchId:
          type: integer
          minimum: 1
          nullable: true
        partnerHandoffId:
          type: integer
          minimum: 1
          nullable: true
        note:
          type: string
          nullable: true
        audit:
          $ref: '#/components/schemas/TreasuryWorkflowAuditInput'
    TreasuryRevenueRealization:
      type: object
      required:
        - id
        - ledger_entry_id
        - accounting_period_id
        - realization_status
        - realized_at
        - recognized_by
        - metadata
        - created_at
      properties:
        id:
          type: integer
          minimum: 1
        ledger_entry_id:
          type: integer
          minimum: 1
        accounting_period_id:
          type: integer
          minimum: 1
        sweep_batch_id:
          type: integer
          nullable: true
        partner_handoff_id:
          type: integer
          nullable: true
        realization_status:
          $ref: '#/components/schemas/TreasuryRevenueRealizationStatus'
        realized_at:
          type: string
          format: date-time
        recognized_by:
          type: string
        note:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    TreasuryRevenueRealizationResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/TreasuryRevenueRealization'
        timestamp:
          type: string
          format: date-time
    TreasurySignerAuditOnlyRequest:
      type: object
      required:
        - signerWallet
        - audit
      properties:
        signerWallet:
          type: string
        audit:
          $ref: '#/components/schemas/TreasuryWorkflowAuditInput'
