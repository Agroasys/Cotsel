components:
  schemas:
    TreasurySweepBatchResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/TreasurySweepBatch'
        timestamp:
          type: string
          format: date-time
    TreasuryCreateSweepBatchRequest:
      type: object
      required:
        - batchKey
        - accountingPeriodId
        - assetSymbol
        - expectedTotalRaw
        - audit
      properties:
        batchKey:
          type: string
        accountingPeriodId:
          type: integer
          minimum: 1
        assetSymbol:
          type: string
        expectedTotalRaw:
          type: string
        payoutReceiverAddress:
          type: string
          nullable: true
        audit:
          $ref: '#/components/schemas/TreasuryWorkflowAuditInput'
    TreasurySweepBatchEntry:
      type: object
      required:
        - id
        - sweep_batch_id
        - ledger_entry_id
        - allocation_status
        - entry_amount_raw
        - allocated_by
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          minimum: 1
        sweep_batch_id:
          type: integer
          minimum: 1
        ledger_entry_id:
          type: integer
          minimum: 1
        allocation_status:
          $ref: '#/components/schemas/TreasurySweepBatchAllocationStatus'
        entry_amount_raw:
          type: string
        allocated_by:
          type: string
        released_by:
          type: string
          nullable: true
        release_note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TreasurySweepBatchEntryResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/TreasurySweepBatchEntry'
        timestamp:
          type: string
          format: date-time
    TreasurySweepBatchEntryAllocationRequest:
      type: object
      required:
        - ledgerEntryId
        - audit
      properties:
        ledgerEntryId:
          type: integer
          minimum: 1
        entryAmountRaw:
          type: string
        audit:
          $ref: '#/components/schemas/TreasuryWorkflowAuditInput'
    TreasurySweepBatchExecutionRequest:
      type: object
      required:
        - matchedSweepTxHash
        - audit
      properties:
        matchedSweepTxHash:
          type: string
        audit:
          $ref: '#/components/schemas/TreasuryWorkflowAuditInput'
    TreasuryPartnerHandoff:
      type: object
      required:
        - id
        - sweep_batch_id
        - partner_name
        - partner_reference
        - handoff_status
        - latest_payload_hash
        - metadata
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          minimum: 1
        sweep_batch_id:
          type: integer
          minimum: 1
        partner_name:
          type: string
        partner_reference:
          type: string
        handoff_status:
          $ref: '#/components/schemas/TreasuryPartnerHandoffStatus'
        latest_payload_hash:
          type: string
        evidence_reference:
          type: string
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        acknowledged_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        failed_at:
          type: string
          format: date-time
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TreasuryPartnerHandoffRequest:
      description: |
        Compatibility-named request schema for recording external execution handoff evidence. Field names remain partner-prefixed for stable client compatibility.
      type: object
      required:
        - partnerName
        - partnerReference
        - handoffStatus
        - audit
      properties:
        partnerName:
          type: string
          description: Compatibility field for the external execution counterparty identifier.
        partnerReference:
          type: string
          description: Compatibility field for the external execution reference supplied by the counterparty.
        handoffStatus:
          $ref: '#/components/schemas/TreasuryPartnerHandoffStatus'
        evidenceReference:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        audit:
          $ref: '#/components/schemas/TreasuryWorkflowAuditInput'
    TreasuryPartnerHandoffResponse:
      description: |
        Compatibility-named response schema for external execution handoff evidence.
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/TreasuryPartnerHandoff'
        timestamp:
          type: string
          format: date-time
    TreasuryLedgerEntryAccountingProjection:
      type: object
      required:
        - ledger_entry_id
        - trade_id
        - component_type
        - amount_raw
        - earned_at
        - accounting_state
        - accounting_state_reason
      properties:
        ledger_entry_id:
          type: integer
          minimum: 1
        trade_id:
          type: string
        component_type:
          type: string
        amount_raw:
          type: string
        allocated_amount_raw:
          type: string
          nullable: true
        earned_at:
          type: string
          format: date-time
        payout_state:
          type: string
          nullable: true
        accounting_period_id:
          type: integer
          nullable: true
        accounting_period_key:
          type: string
          nullable: true
        accounting_period_status:
          oneOf:
            - $ref: '#/components/schemas/TreasuryAccountingPeriodStatus'
            - type: 'null'
        sweep_batch_id:
          type: integer
          nullable: true
        sweep_batch_status:
          oneOf:
            - $ref: '#/components/schemas/TreasurySweepBatchStatus'
            - type: 'null'
        allocation_status:
          oneOf:
            - $ref: '#/components/schemas/TreasurySweepBatchAllocationStatus'
            - type: 'null'
        matched_sweep_tx_hash:
          type: string
          nullable: true
        matched_sweep_block_number:
          type: integer
          nullable: true
        matched_swept_at:
          type: string
          format: date-time
          nullable: true
        matched_treasury_identity:
          type: string
          nullable: true
        matched_payout_receiver:
          type: string
          nullable: true
        matched_claim_amount_raw:
          type: string
          nullable: true
        partner_handoff_id:
          type: integer
          nullable: true
        partner_name:
          type: string
          nullable: true
        partner_reference:
          type: string
          nullable: true
        partner_handoff_status:
          oneOf:
            - $ref: '#/components/schemas/TreasuryPartnerHandoffStatus'
            - type: 'null'
        partner_completed_at:
          type: string
          format: date-time
          nullable: true
        latest_fiat_deposit_state:
          type: string
          nullable: true
        latest_bank_payout_state:
          type: string
          nullable: true
        revenue_realization_status:
          oneOf:
            - $ref: '#/components/schemas/TreasuryRevenueRealizationStatus'
            - type: 'null'
        realized_at:
          type: string
          format: date-time
          nullable: true
        accounting_state:
          $ref: '#/components/schemas/TreasuryAccountingState'
        accounting_state_reason:
          type: string
    TreasurySweepBatchDetail:
      type: object
      required:
        - batch
        - entries
        - partnerHandoff
        - totals
      properties:
        batch:
          $ref: '#/components/schemas/TreasurySweepBatch'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TreasuryLedgerEntryAccountingProjection'
        partnerHandoff:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TreasuryPartnerHandoff'
        totals:
          type: object
          required:
            - allocatedAmountRaw
            - entryCount
          properties:
            allocatedAmountRaw:
              type: string
            entryCount:
              type: integer
              minimum: 0
    TreasurySweepBatchDetailResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/TreasurySweepBatchDetail'
        timestamp:
          type: string
          format: date-time
    TreasuryCloseIssue:
      type: object
      required:
        - code
        - severity
        - owner
        - message
      properties:
        code:
          type: string
        severity:
          type: string
          enum:
            - BLOCKING
            - WARNING
        owner:
          type: string
          enum:
            - TREASURY
            - FINANCE
            - RECONCILIATION
            - OPS
        message:
          type: string
        trade_id:
          type: string
          nullable: true
        sweep_batch_id:
          type: integer
          nullable: true
        ledger_entry_id:
          type: integer
          nullable: true
        details:
          type: object
          additionalProperties: true
