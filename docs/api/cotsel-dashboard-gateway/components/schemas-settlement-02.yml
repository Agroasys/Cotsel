components:
  schemas:
    SettlementGaslessCreateTradeExecutionRequest:
      type: object
      required:
        - action
        - handoffId
        - chainId
        - contractAddress
        - expiresAt
        - payloadHash
        - buyerAddress
        - supplierAddress
        - totalAmount
        - logisticsAmount
        - platformFeesAmount
        - supplierFirstTranche
        - supplierSecondTranche
        - ricardianHash
        - buyerAuthorization
        - usdcAuthorization
      properties:
        action:
          type: string
          enum:
            - create_trade
        chainId:
          type: integer
          minimum: 1
          description: Chain ID that must match the configured Cotsel settlement runtime.
        contractAddress:
          type: string
          description: Escrow contract address that must match the configured allowlisted runtime.
        expiresAt:
          type: string
          format: date-time
          description: Backend-approved request expiry. Cotsel rejects expired or over-long requests.
        payloadHash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
          description: Cotsel recomputes this hash from the normalized execution payload before simulation.
        handoffId:
          type: string
        buyerAddress:
          type: string
          description: Buyer settlement wallet authorized by the platform backend; must match usdcAuthorization.from.
        supplierAddress:
          type: string
        totalAmount:
          type: string
          pattern: ^[0-9]+$
        logisticsAmount:
          type: string
          pattern: ^[0-9]+$
        platformFeesAmount:
          type: string
          pattern: ^[0-9]+$
        supplierFirstTranche:
          type: string
          pattern: ^[0-9]+$
        supplierSecondTranche:
          type: string
          pattern: ^[0-9]+$
        ricardianHash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        buyerAuthorization:
          $ref: '#/components/schemas/SettlementGaslessBuyerAuthorization'
        usdcAuthorization:
          $ref: '#/components/schemas/SettlementGaslessUsdcAuthorization'
    SettlementGaslessCreateTradeExecutionPayload:
      type: object
      required:
        - handoff
        - acceptedEvent
        - queuedEvent
        - simulationEvent
        - submittedEvent
        - txHash
      properties:
        handoff:
          $ref: '#/components/schemas/SettlementHandoff'
        acceptedEvent:
          $ref: '#/components/schemas/SettlementExecutionEvent'
        queuedEvent:
          $ref: '#/components/schemas/SettlementExecutionEvent'
        simulationEvent:
          $ref: '#/components/schemas/SettlementExecutionEvent'
        submittedEvent:
          $ref: '#/components/schemas/SettlementExecutionEvent'
        txHash:
          type: string
          description: Canonical EVM transaction hash submitted by Cotsel.
    SettlementGaslessCreateTradeExecutionResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/SettlementGaslessCreateTradeExecutionPayload'
        timestamp:
          type: string
          format: date-time
    SettlementGaslessUserActionExecutionRequest:
      type: object
      required:
        - action
        - handoffId
        - chainId
        - contractAddress
        - expiresAt
        - payloadHash
        - userAddress
        - tradeId
        - userAuthorization
      properties:
        action:
          type: string
          enum:
            - open_dispute
            - cancel_locked_timeout
            - refund_in_transit_timeout
            - finalize_after_dispute_window
            - finalize_after_inspection_acceptance
        chainId:
          type: integer
          minimum: 1
          description: Chain ID that must match the configured Cotsel settlement runtime.
        contractAddress:
          type: string
          description: Escrow contract address that must match the configured allowlisted runtime.
        expiresAt:
          type: string
          format: date-time
          description: Backend-approved request expiry. Cotsel rejects expired or over-long requests.
        payloadHash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
          description: Cotsel recomputes this hash from the normalized execution payload before simulation.
        handoffId:
          type: string
        userAddress:
          type: string
          description: Buyer wallet that signed the requested escrow action.
        tradeId:
          type: string
          pattern: ^[0-9]+$
        userAuthorization:
          $ref: '#/components/schemas/SettlementGaslessUserAuthorization'
    SettlementGaslessUserActionExecutionPayload:
      type: object
      required:
        - handoff
        - acceptedEvent
        - queuedEvent
        - simulationEvent
        - submittedEvent
        - txHash
      properties:
        handoff:
          $ref: '#/components/schemas/SettlementHandoff'
        acceptedEvent:
          $ref: '#/components/schemas/SettlementExecutionEvent'
        queuedEvent:
          $ref: '#/components/schemas/SettlementExecutionEvent'
        simulationEvent:
          $ref: '#/components/schemas/SettlementExecutionEvent'
        submittedEvent:
          $ref: '#/components/schemas/SettlementExecutionEvent'
        txHash:
          type: string
          description: Canonical EVM transaction hash submitted by Cotsel.
    SettlementGaslessUserActionExecutionResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/SettlementGaslessUserActionExecutionPayload'
        timestamp:
          type: string
          format: date-time
    SettlementGaslessOperatorActionExecutionRequest:
      type: object
      required:
        - action
        - handoffId
        - chainId
        - contractAddress
        - expiresAt
        - payloadHash
        - tradeId
      properties:
        action:
          type: string
          enum:
            - finalize_after_dispute_window
        chainId:
          type: integer
          minimum: 1
          description: Chain ID that must match the configured Cotsel settlement runtime.
        contractAddress:
          type: string
          description: Escrow contract address that must match the configured allowlisted runtime.
        expiresAt:
          type: string
          format: date-time
          description: Backend-approved request expiry. Cotsel rejects expired or over-long requests.
        payloadHash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
          description: Cotsel recomputes this hash from the normalized execution payload before simulation.
        handoffId:
          type: string
        tradeId:
          type: string
          pattern: ^[0-9]+$
    SettlementGaslessOperatorActionExecutionPayload:
      type: object
      required:
        - handoff
        - acceptedEvent
        - queuedEvent
        - simulationEvent
        - submittedEvent
        - txHash
      properties:
        handoff:
          $ref: '#/components/schemas/SettlementHandoff'
        acceptedEvent:
          $ref: '#/components/schemas/SettlementExecutionEvent'
        queuedEvent:
          $ref: '#/components/schemas/SettlementExecutionEvent'
        simulationEvent:
          $ref: '#/components/schemas/SettlementExecutionEvent'
        submittedEvent:
          $ref: '#/components/schemas/SettlementExecutionEvent'
        txHash:
          type: string
          description: Canonical EVM transaction hash submitted by Cotsel.
    SettlementGaslessOperatorActionExecutionResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/SettlementGaslessOperatorActionExecutionPayload'
        timestamp:
          type: string
          format: date-time
    SponsoredWalletUsdcTransferRequest:
      type: object
      additionalProperties: false
      required:
        - action
        - platformTransferId
        - chainId
        - tokenAddress
        - authorizationDomainName
        - from
        - to
        - value
        - validAfter
        - validBefore
        - nonce
        - v
        - r
        - s
      properties:
        action:
          type: string
          const: wallet_usdc_transfer
        platformTransferId:
          type: string
          minLength: 1
          maxLength: 128
        chainId:
          type: integer
          minimum: 1
        tokenAddress:
          type: string
          description: USDC token address that must match the configured allowlist.
        authorizationDomainName:
          type: string
          minLength: 1
          maxLength: 100
        from:
          type: string
          description: Verified Agroasys wallet that signed the authorization.
        to:
          type: string
          description: External recipient wallet.
        value:
          type: string
          pattern: ^[0-9]+$
          description: Exact USDC amount in token base units.
        validAfter:
          type: string
          pattern: ^[0-9]+$
        validBefore:
          type: string
          pattern: ^[0-9]+$
        nonce:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        v:
          type: integer
          enum:
            - 27
            - 28
        r:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        s:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
    SponsoredWalletUsdcTransferReceipt:
      type: object
      required:
        - txHash
        - blockNumber
        - gasUsed
        - effectiveGasPriceWei
        - nativeCostWei
        - executorAddress
        - executorBalanceWei
      properties:
        txHash:
          type: string
        blockNumber:
          type: string
          pattern: ^[0-9]+$
        gasUsed:
          type: string
          pattern: ^[0-9]+$
        effectiveGasPriceWei:
          type: string
          pattern: ^[0-9]+$
        nativeCostWei:
          type: string
          pattern: ^[0-9]+$
        executorAddress:
          type: string
        executorBalanceWei:
          type: string
          pattern: ^[0-9]+$
    SponsoredWalletUsdcTransferPayload:
      type: object
      required:
        - platformTransferId
        - txHash
        - receipt
        - requestId
      properties:
        platformTransferId:
          type: string
        txHash:
          type: string
        receipt:
          $ref: '#/components/schemas/SponsoredWalletUsdcTransferReceipt'
        requestId:
          type: string
    SponsoredWalletUsdcTransferResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/SponsoredWalletUsdcTransferPayload'
        timestamp:
          type: string
          format: date-time
    SettlementHandoffResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/SettlementHandoff'
        timestamp:
          type: string
          format: date-time
    SettlementOracleProgressionResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
            - handoffId
            - phase
            - oraclePath
            - disposition
            - oracle
          properties:
            handoffId:
              type: string
            phase:
              type: string
              enum:
                - initial_release_after_custody_and_documents
                - inspection_available_standard
                - inspection_available_packaged_local
                - final_release_after_inspection_acceptance
                - final_release_after_notice_deadline
            oraclePath:
              type: string
            disposition:
              type: string
              enum:
                - submitted
                - already_completed
            oracle:
              type: object
              additionalProperties: true
        timestamp:
          type: string
          format: date-time
