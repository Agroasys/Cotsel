components:
  schemas:
    ReconciliationContainment:
      type: object
      additionalProperties: false
      required:
        - tradeId
        - incidentReference
        - state
        - openedRunKey
        - openedAt
        - qualifyingCodes
        - clearedRunKey
        - rulesVersion
        - findings
        - evidence
      properties:
        tradeId: { type: string }
        incidentReference: { type: string }
        state:
          type: string
          enum: [CONTAINED, RECONCILED_PENDING_APPROVAL, RELEASED]
        openedRunKey: { type: string }
        openedAt: { type: string, format: date-time }
        qualifyingCodes:
          type: array
          items: { type: string }
        clearedRunKey: { type: ['string', 'null'] }
        rulesVersion: { type: ['string', 'null'] }
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [digest, mismatchCode, comparedField, status]
            properties:
              digest: { type: string, pattern: '^[0-9a-f]{64}$' }
              mismatchCode: { type: ['string', 'null'] }
              comparedField: { type: ['string', 'null'] }
              status:
                type: string
                enum: [verified, failed, missing, unsigned]
        evidence:
          type: object
          additionalProperties: false
          required: [status, reason]
          properties:
            status:
              type: string
              enum: [verified, failed, unsigned]
            reason: { type: ['string', 'null'] }
    ReconciliationContainmentResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success: { type: boolean, const: true }
        data:
          $ref: '#/components/schemas/ReconciliationContainment'
        timestamp: { type: string, format: date-time }
    ReconciliationContainmentListResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ReconciliationContainment'
        timestamp: { type: string, format: date-time }
