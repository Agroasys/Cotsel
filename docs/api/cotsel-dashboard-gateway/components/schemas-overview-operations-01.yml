components:
  schemas:
    OverviewFeedStatus:
      type: object
      required:
        - source
        - state
        - queriedAt
        - freshAt
        - available
      properties:
        source:
          type: string
          enum:
            - indexer_graphql
            - chain_rpc
            - gateway_ledger
          description: Identifies which backend feed provided (or attempted to provide) this data.
        state:
          type: string
          enum:
            - current
            - stale
            - unavailable
          description: Feed freshness posture derived from the source watermark and gateway availability.
        queriedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: ISO timestamp of when the gateway successfully queried this feed for the current snapshot; null when the feed is unavailable.
        freshAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: Source-authoritative freshness timestamp for this feed; null when the feed is unavailable.
        available:
          type: boolean
          description: False when the feed returned an error or timed out for this request.
    OverviewTradeFeedStatus:
      allOf:
        - $ref: '#/components/schemas/OverviewFeedStatus'
        - type: object
          required:
            - lastIndexedAt
            - lastProcessedBlock
            - lastTradeEventAt
          properties:
            lastIndexedAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
              description: Indexer watermark timestamp for the most recently processed block; mirrors `freshAt` when available.
            lastProcessedBlock:
              anyOf:
                - type: string
                - type: 'null'
              description: Block number of the last block processed by the indexer; null when the feed is unavailable.
            lastTradeEventAt:
              anyOf:
                - type: string
                  format: date-time
                - type: 'null'
              description: Timestamp of the last trade lifecycle event indexed; null when no events have been indexed yet or the feed is unavailable.
    OverviewTradeKpis:
      type: object
      required:
        - total
        - byStatus
      properties:
        total:
          type: integer
          minimum: 0
          description: Total number of trades ever locked, as tracked by the indexer overview snapshot.
        byStatus:
          type: object
          required:
            - locked
            - stage_1
            - stage_2
            - completed
            - disputed
            - cancelled
          properties:
            locked:
              type: integer
              minimum: 0
            stage_1:
              type: integer
              minimum: 0
            stage_2:
              type: integer
              minimum: 0
            completed:
              type: integer
              minimum: 0
            disputed:
              type: integer
              minimum: 0
            cancelled:
              type: integer
              minimum: 0
    OverviewPosture:
      type: object
      required:
        - paused
        - claimsPaused
        - oracleActive
      description: |
        Current on-chain protocol posture derived from chain RPC.
        Null when the governance feed is unavailable (`feedFreshness.governance.available = false`).
      properties:
        paused:
          type: boolean
        claimsPaused:
          type: boolean
        oracleActive:
          type: boolean
    OverviewSnapshot:
      type: object
      required:
        - kpis
        - feedFreshness
      properties:
        kpis:
          type: object
          required:
            - trades
            - compliance
          properties:
            trades:
              $ref: '#/components/schemas/OverviewTradeKpis'
            compliance:
              type: object
              required:
                - blockedTrades
              properties:
                blockedTrades:
                  type: integer
                  minimum: 0
                  description: Number of trades currently blocked by an active compliance hold.
        posture:
          anyOf:
            - $ref: '#/components/schemas/OverviewPosture'
            - type: 'null'
          description: Null when the chain RPC feed is unavailable.
        feedFreshness:
          type: object
          required:
            - trades
            - governance
            - compliance
          properties:
            trades:
              $ref: '#/components/schemas/OverviewTradeFeedStatus'
            governance:
              $ref: '#/components/schemas/OverviewFeedStatus'
            compliance:
              $ref: '#/components/schemas/OverviewFeedStatus'
    OverviewResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/OverviewSnapshot'
        timestamp:
          type: string
          format: date-time
    OperationsState:
      type: string
      enum:
        - healthy
        - degraded
        - unavailable
        - stale
    OperationsServiceStatus:
      type: object
      required:
        - key
        - name
        - state
        - source
        - checkedAt
        - lastSuccessAt
        - freshnessMs
        - staleAfterMs
        - latencyMs
      properties:
        key:
          type: string
          examples:
            - oracle
            - indexer
            - reconciliation
            - treasury
            - ricardian
            - notifications
        name:
          type: string
        state:
          $ref: '#/components/schemas/OperationsState'
        source:
          type: string
          description: Probe source identifier such as `indexer_graphql` or `oracle_http`.
        checkedAt:
          type: string
          format: date-time
          description: Timestamp when this service status was checked for the snapshot.
        lastSuccessAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          description: Last successful probe timestamp, or null when no success baseline exists.
        freshnessMs:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
          description: Milliseconds since `lastSuccessAt`; null when the service has never had a successful probe baseline.
        staleAfterMs:
          type: integer
          minimum: 1
        latencyMs:
          anyOf:
            - type: integer
              minimum: 0
            - type: 'null'
          description: Probe latency in milliseconds when available.
        detail:
          type: string
    OperationsIncidentSeverity:
      type: string
      enum:
        - critical
        - high
        - medium
        - low
    OperationsIncidentItem:
      type: object
      required:
        - incidentId
        - title
        - severity
        - state
        - sourceServiceKey
        - firstObservedAt
        - lastObservedAt
      properties:
        incidentId:
          type: string
        title:
          type: string
        severity:
          $ref: '#/components/schemas/OperationsIncidentSeverity'
        state:
          type: string
          enum:
            - open
        sourceServiceKey:
          type: string
        firstObservedAt:
          type: string
          format: date-time
        lastObservedAt:
          type: string
          format: date-time
        detail:
          type: string
    OperationsIncidentSummary:
      type: object
      required:
        - state
        - source
        - generatedAt
        - openCount
        - bySeverity
        - items
      properties:
        state:
          $ref: '#/components/schemas/OperationsState'
        source:
          type: string
          const: gateway_derived
        generatedAt:
          type: string
          format: date-time
        openCount:
          type: integer
          minimum: 0
        bySeverity:
          type: object
          required:
            - critical
            - high
            - medium
            - low
          properties:
            critical:
              type: integer
              minimum: 0
            high:
              type: integer
              minimum: 0
            medium:
              type: integer
              minimum: 0
            low:
              type: integer
              minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationsIncidentItem'
    OperationsSummarySnapshot:
      type: object
      required:
        - state
        - generatedAt
        - services
        - incidents
      properties:
        state:
          $ref: '#/components/schemas/OperationsState'
        generatedAt:
          type: string
          format: date-time
        services:
          type: array
          items:
            $ref: '#/components/schemas/OperationsServiceStatus'
        incidents:
          $ref: '#/components/schemas/OperationsIncidentSummary'
    OperationsSummaryResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/OperationsSummarySnapshot'
        timestamp:
          type: string
          format: date-time
