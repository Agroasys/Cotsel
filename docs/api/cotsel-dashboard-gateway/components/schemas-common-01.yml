components:
  schemas:
    HealthResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
            - service
            - status
          properties:
            service:
              type: string
              const: dashboard-gateway
            status:
              type: string
              const: ok
        timestamp:
          type: string
          format: date-time
    ReadyResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
        data:
          type: object
          required:
            - service
            - ready
          properties:
            service:
              type: string
              const: dashboard-gateway
            ready:
              type: boolean
            dependencies:
              type: array
              items:
                type: object
                required:
                  - name
                  - status
                properties:
                  name:
                    type: string
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                      - unavailable
                  detail:
                    type: string
        timestamp:
          type: string
          format: date-time
    VersionResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
            - service
            - version
            - commitSha
            - buildTime
          properties:
            service:
              type: string
              const: dashboard-gateway
            version:
              type: string
            commitSha:
              type: string
            buildTime:
              type: string
              format: date-time
            sourceRepo:
              type: string
              const: Cotsel
        timestamp:
          type: string
          format: date-time
    AuthServiceRole:
      type: string
      enum:
        - buyer
        - supplier
        - admin
        - oracle
    GatewayRole:
      type: string
      enum:
        - operator:read
        - operator:write
    OperatorCapabilitySubject:
      type: object
      required:
        - accountId
        - userId
        - authRole
        - gatewayRoles
        - capabilities
      properties:
        accountId:
          type: string
        userId:
          type: string
        walletAddress:
          type: string
          nullable: true
        authRole:
          $ref: '#/components/schemas/AuthServiceRole'
        gatewayRoles:
          type: array
          items:
            $ref: '#/components/schemas/GatewayRole'
        capabilities:
          type: array
          items:
            type: string
            enum:
              - governance:write
              - compliance:write
              - operations:replay
              - treasury:read
              - treasury:prepare
              - treasury:approve
              - treasury:execute_match
              - treasury:close
    OperatorRouteCapabilities:
      type: object
      required:
        - overviewRead
        - operationsRead
        - tradesRead
        - governanceRead
        - complianceRead
      properties:
        overviewRead:
          type: boolean
        operationsRead:
          type: boolean
        tradesRead:
          type: boolean
        governanceRead:
          type: boolean
        complianceRead:
          type: boolean
    OperatorActionCapabilities:
      type: object
      required:
        - governanceWrite
        - complianceWrite
        - operationsReplay
        - treasuryRead
        - treasuryPrepare
        - treasuryApprove
        - treasuryExecuteMatch
        - treasuryClose
      properties:
        governanceWrite:
          type: boolean
        complianceWrite:
          type: boolean
        operationsReplay:
          type: boolean
          description: True only when the operator has explicit authority to replay failed control-plane operations.
        treasuryRead:
          type: boolean
        treasuryPrepare:
          type: boolean
        treasuryApprove:
          type: boolean
        treasuryExecuteMatch:
          type: boolean
        treasuryClose:
          type: boolean
    OperatorWriteAccess:
      type: object
      required:
        - mutationsConfigured
        - allowlisted
        - effective
      properties:
        mutationsConfigured:
          type: boolean
          description: True when gateway mutation routes are enabled in config.
        allowlisted:
          type: boolean
          description: True when the authenticated session matches GATEWAY_WRITE_ALLOWLIST.
        effective:
          type: boolean
          description: True only when the session has operator write role, mutations are enabled, and the session is allowlisted.
    OperatorCapabilitiesSnapshot:
      type: object
      required:
        - subject
        - routes
        - actions
        - writeAccess
      properties:
        subject:
          $ref: '#/components/schemas/OperatorCapabilitySubject'
        routes:
          $ref: '#/components/schemas/OperatorRouteCapabilities'
        actions:
          $ref: '#/components/schemas/OperatorActionCapabilities'
        writeAccess:
          $ref: '#/components/schemas/OperatorWriteAccess'
    OperatorCapabilitiesResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/OperatorCapabilitiesSnapshot'
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - success
        - error
        - timestamp
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorObject'
        timestamp:
          type: string
          format: date-time
    ErrorObject:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          examples:
            - AUTH_UNAUTHORIZED
            - GOV_STATE_CONFLICT
            - CMP_PROVIDER_UNAVAILABLE
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        traceId:
          type: string
        requestId:
          type: string
    MutationAuditInput:
      type: object
      required:
        - reason
        - evidenceLinks
        - ticketRef
      properties:
        reason:
          type: string
          minLength: 8
          maxLength: 2000
        evidenceLinks:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EvidenceLink'
        ticketRef:
          type: string
          minLength: 2
          maxLength: 128
    MutationAuditRecord:
      allOf:
        - $ref: '#/components/schemas/MutationAuditInput'
        - type: object
          required:
            - actorSessionId
            - actorWallet
            - actorRole
            - createdAt
            - requestedBy
          properties:
            actorSessionId:
              type: string
            actorAccountId:
              type: string
              nullable: true
            actorWallet:
              type: string
            actorRole:
              type: string
            createdAt:
              type: string
              format: date-time
            requestedBy:
              type: string
            approvedBy:
              type: array
              items:
                type: string
            finalSignerWallet:
              type: string
              nullable: true
            finalSignerVerifiedAt:
              type: string
              format: date-time
              nullable: true
    GatewayReadFreshness:
      type: object
      required:
        - source
        - sourceFreshAt
        - queriedAt
        - available
      properties:
        source:
          type: string
        sourceFreshAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        queriedAt:
          type: string
          format: date-time
        available:
          type: boolean
        degradedReason:
          type: string
