paths:
  /settlement/transactions/{transactionHash}/finality:
    get:
      tags: [Settlement]
      summary: Read finalized settlement evidence and retained projection coverage
      description: Service-authenticated read. Issuance pause does not disable observation. Pending or unproven evidence returns 503.
      operationId: getSettlementTransactionFinality
      security: []
      parameters:
        - name: transactionHash
          in: path
          required: true
          schema:
            type: string
            pattern: ^0x[0-9a-fA-F]{64}$
        - name: chainId
          in: query
          description: Historical chain identity. Supply with escrowAddress. The server must approve the retained deployment.
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,15}$
        - name: escrowAddress
          in: query
          description: Original escrow identity. Supply with chainId. Caller-provided RPC URLs are rejected.
          schema:
            type: string
            pattern: ^0x[0-9a-fA-F]{40}$
      responses:
        '200':
          description: Independently matching finalized receipt and retained indexer/reconciliation coverage.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  timestamp:
                    type: string
                    format: date-time
                  data:
                    $ref: '#/components/schemas/SettlementFinalityEvidence'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: Finalized matching evidence is not available yet.
  /settlement/gasless-executions/user-action/operations/{sourceOperationId}:
    get:
      tags: [Settlement]
      summary: Read the issuing service's retained user-action operation inventory
      description: Existing service HMAC authentication is required. This read remains available when execution is denied. A missing or foreign operation returns the same 404; it never proves non-execution. No authorization signatures or signed bytes are returned.
      operationId: getSettlementUserActionOperationInventory
      security: []
      parameters:
        - name: sourceOperationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bounded immutable instruction, attempt and outcome inventory owned by the authenticated service.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success: { const: true }
                  timestamp: { type: string, format: date-time }
                  data:
                    $ref: '#/components/schemas/SettlementUserActionInventory'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Service authentication failed.
        '404':
          description: No operation belongs to the authenticated issuing service.
        '409':
          description: Inventory exceeds the automatic observation bound or is inconsistent.
        '503':
          description: Operation inventory is unavailable.
