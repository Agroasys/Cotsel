paths:
  /governance/treasury/sweep/prepare:
    post:
      tags:
        - Governance
      summary: Prepare treasury sweep for direct admin signing
      operationId: prepareClaimTreasury
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceDirectSignPrepareRequest'
      responses:
        '200':
          description: Canonical direct-sign payload prepared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceActionPreparedResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
