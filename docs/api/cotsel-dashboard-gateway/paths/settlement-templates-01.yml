paths:
  /settlement-templates:
    get:
      tags:
        - Settlement Templates
      summary: List settlement template versions
      description: |
        Every version of every settlement template (Cotsel#940), ordered by template and version.
        See `docs/runbooks/settlement-templates.md` for the lifecycle and what enforces each rule.
      operationId: listSettlementTemplates
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCorrelationId'
        - name: templateId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SettlementTemplateId'
      responses:
        '200':
          description: Template versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementTemplateListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags:
        - Settlement Templates
      summary: Create a settlement template draft
      description: |
        Records a new template version as a draft. Its terms and SHA-256 hash never change
        afterwards. Requires `governance:write`, a recent upstream step-up (403 with
        `details.reason = step_up_required` otherwise) and an `Idempotency-Key`. The audit row
        commits in the same transaction as the draft.
      operationId: createSettlementTemplateDraft
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementTemplateCreateRequest'
      responses:
        '201':
          description: Draft recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementTemplateVersionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /settlement-templates/{templateId}/versions/{version}:
    get:
      tags:
        - Settlement Templates
      summary: Get one settlement template version
      operationId: getSettlementTemplateVersion
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/SettlementTemplateIdPath'
        - $ref: '#/components/parameters/SettlementTemplateVersionPath'
      responses:
        '200':
          description: Template version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementTemplateVersionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /settlement-templates/{templateId}/versions/{version}/review:
    post:
      tags:
        - Settlement Templates
      summary: Review a settlement template draft
      description: Moves a draft to reviewed. The reviewer must not be the author.
      operationId: reviewSettlementTemplate
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SettlementTemplateIdPath'
        - $ref: '#/components/parameters/SettlementTemplateVersionPath'
      responses:
        '200':
          description: Version reviewed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementTemplateVersionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /settlement-templates/activations:
    get:
      tags:
        - Settlement Templates
      summary: List template activation preparations
      description: |
        Every governed activation preparation (review R05), newest first, with its exact target,
        the version it expects to replace, who prepared, approved and confirmed it, and why a
        superseded one was invalidated.
      operationId: listSettlementTemplateActivations
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCorrelationId'
        - name: templateId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SettlementTemplateId'
      responses:
        '200':
          description: Activation preparations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementTemplateActivationPreparationListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /settlement-templates/{templateId}/versions/{version}/activations:
    post:
      tags:
        - Settlement Templates
      summary: Prepare the activation of a reviewed settlement template version
      description: |
        Records a durable preparation that binds the exact target (template id, version and terms
        hash) to the exact version it will replace, or none. Nothing is activated yet. The version
        must be `reviewed` and listed in `GATEWAY_TEMPLATE_ACTIVATION_ALLOWLIST` (409 with
        `details.reason = template_not_enforced_by_contract` otherwise), because the escrow
        enforces only those terms until #955. A preparation expires after 24 hours.
      operationId: prepareSettlementTemplateActivation
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SettlementTemplateIdPath'
        - $ref: '#/components/parameters/SettlementTemplateVersionPath'
      responses:
        '201':
          description: Activation prepared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementTemplateActivationPreparationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /settlement-templates/activations/{preparationId}/approve:
    post:
      tags:
        - Settlement Templates
      summary: Approve a prepared template activation
      description: |
        Independent approval of that exact preparation. The approver must be neither its
        preparer nor the template's author (409 `independent_approval_required`). A preparation
        whose target or expected predecessor changed is marked superseded and refused (409
        `activation_preparation_stale`); an expired one is refused (409
        `activation_preparation_expired`).
      operationId: approveSettlementTemplateActivation
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SettlementTemplateActivationPreparationIdPath'
      responses:
        '200':
          description: Activation approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementTemplateActivationPreparationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /settlement-templates/activations/{preparationId}/confirm:
    post:
      tags:
        - Settlement Templates
      summary: Confirm an approved template activation
      description: |
        Under lock, re-checks that the target is still the reviewed terms that were approved and
        that the active version is still the one the preparation expected. Then, in one
        transaction, it retires that predecessor, activates the target and records the audit
        entry. A changed target or predecessor supersedes the preparation (409
        `activation_preparation_stale`). The template's author cannot confirm (409
        `independent_activation_required`). A confirmed preparation is never confirmed again
        (409 `activation_already_confirmed`). There is no other way to activate a version.
      operationId: confirmSettlementTemplateActivation
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SettlementTemplateActivationPreparationIdPath'
      responses:
        '200':
          description: |
            Version active. `retired` is the version it replaced (the expected predecessor), if
            any, and `preparation` is the confirmed preparation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementTemplateActivationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /settlement-templates/{templateId}/versions/{version}/retire:
    post:
      tags:
        - Settlement Templates
      summary: Retire a draft or reviewed settlement template version
      description: |
        The active version cannot be retired on its own (409 with
        `details.reason = active_template_requires_replacement`), because settlements would then
        have no terms. It is replaced by activating another version.
      operationId: retireSettlementTemplate
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SettlementTemplateIdPath'
        - $ref: '#/components/parameters/SettlementTemplateVersionPath'
      responses:
        '200':
          description: Version retired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementTemplateVersionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
